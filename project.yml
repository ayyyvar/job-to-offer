# Source of truth for job-to-offer.xcodeproj. Regenerate with: xcodegen generate
name: job-to-offer
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  # Files added in Xcode (or on disk) join their target without `xcodegen generate`.
  defaultSourceDirectoryType: syncedFolder
# APP_BUNDLE_ID, APP_GROUP_ID and DEVELOPMENT_TEAM live in Signing.xcconfig (override in Local.xcconfig).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Core:
    path: .
targets:
  job-to-offer:
    type: application
    platform: iOS
    sources:
      - path: JobToOfferApp
    dependencies:
      - package: Core
      - target: ShareExtension
    settings:
      base:
        PRODUCT_NAME: job-to-offer
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: JobToOfferApp/JobToOffer.entitlements
        INFOPLIST_FILE: JobToOfferApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: job-to-offer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ShareExtension
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Add to job-to-offer
        SKIP_INSTALL: YES
  DeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DeviceTests
      - path: Tests/CoreTests/Support/CandidateProfileFixture.swift
      - path: Tests/Fixtures
        type: folder
    dependencies:
      - target: job-to-offer
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).DeviceTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  job-to-offer:
    build:
      targets:
        job-to-offer: all
    test:
      config: Debug
      targets:
        - package: Core/CoreTests
        - name: DeviceTests
